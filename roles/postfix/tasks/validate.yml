---
- name: "Ensure that variable is string"
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) | type_debug in ["str", "string", "AnsibleUnicode", "AnsibleUnsafeText", "AnsibleVaultEncryptedUnicode"]
    quiet: true
    fail_msg: "The variable must be a string, but received {{ lookup('ansible.builtin.vars', item) | type_debug }}"
  loop:
    - postfix_file_content_smtp_generic_maps
    - postfix_file_content_sasl_password_maps
    - postfix_file_content_smtp_header_checks
    - postfix_file_content_sender_canonical_maps
  tags:
    - postfix
    - validate


- name: "Ensure that variable is dict"
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) is mapping
    quiet: true
    fail_msg: "The variable must be a dictionary, but received {{ lookup('ansible.builtin.vars', item) | type_debug }}"
  loop:
    - postfix_aliases
    - postfix_main_conf_setting
    - postfix_main_conf_default
  tags:
    - postfix
    - validate
