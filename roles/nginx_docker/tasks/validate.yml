---
- name: "Ensure that variable is string"
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) | type_debug in ["str", "string", "AnsibleUnicode", "AnsibleUnsafeText", "AnsibleVaultEncryptedUnicode"]
    quiet: true
    fail_msg: "The variable must be a string, but received {{ lookup('ansible.builtin.vars', item) | type_debug }}"
  loop:
    - nginx_docker_version
    - nginx_docker_tag
    - nginx_docker_image
    - nginx_docker_instance
    - nginx_docker_network
    - nginx_docker_timezone
    - nginx_docker_cert_dir
    - nginx_docker_conf_dir
    - nginx_docker_data_dir
    - nginx_docker_logs_dir
    - nginx_docker_cert_src
    - nginx_docker_conf_src
    - nginx_docker_data_src
  tags:
    - nginx
    - validate


- name: "Ensure that variable is integer"
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) | string | regex_search("^[0-9]+$") is not none
    quiet: true
    fail_msg: "The variable must be an integer, but received {{ lookup('ansible.builtin.vars', item) | type_debug }}"
  loop:
    - nginx_docker_uid
    - nginx_docker_gid
  tags:
    - nginx
    - validate


- name: "Ensure that variable is list"
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) | type_debug in ["list", "AnsibleSequence"]
    quiet: true
    fail_msg: "The variable must be a list, but received {{ lookup('ansible.builtin.vars', item) | type_debug }}"
  loop:
    - nginx_docker_extra_volumes
    - nginx_docker_tmpfs_volumes
    - nginx_docker_listen_port
  tags:
    - nginx
    - validate
